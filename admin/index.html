<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#102d29">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://*.googleusercontent.com; style-src 'self' 'unsafe-inline'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebasestorage.googleapis.com wss://*.googleapis.com wss://*.firebaseio.com; frame-src 'self' https://*.firebaseapp.com https://*.web.app; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <title>俐姐的家｜網站管理</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <main class="shell">
    <section id="configNotice" class="notice hidden" role="alert">
      尚未連接 Firebase。請依照壓縮檔內的「安裝說明.md」從建立專案開始完成一次性設定。
    </section>

    <section id="loginView" class="login-card">
      <div class="brand-mark" aria-hidden="true">俐</div>
      <p class="eyebrow">LIJIE'S HOME</p>
      <h1>網站管理後台</h1>
      <p class="muted">使用已授權的管理信箱登入。</p>
      <form id="loginForm">
        <label>管理信箱<input id="email" name="email" type="email" autocomplete="username" required></label>
        <label>密碼<input id="password" name="password" type="password" autocomplete="current-password" minlength="10" required></label>
        <button class="primary" type="submit">登入</button>
      </form>
      <p id="loginMessage" class="message" aria-live="polite"></p>
    </section>

    <section id="dashboardView" class="dashboard hidden">
      <header class="topbar">
        <div><p class="eyebrow">CONTENT STUDIO</p><h1>俐姐的家</h1><p id="accountEmail" class="muted"></p></div>
        <div class="top-actions"><a class="secondary" href="../" target="_blank" rel="noopener noreferrer">查看官網</a><button id="logoutButton" class="secondary" type="button">登出</button></div>
      </header>

      <nav class="tabs" aria-label="後台分類">
        <button class="tab active" data-tab="photos" type="button">照片管理</button>
        <button class="tab" data-tab="copy" type="button">文字與資訊</button>
        <button class="tab" data-tab="publish" type="button">預覽與發布</button>
      </nav>

      <section id="photosPanel" class="panel">
        <div class="panel-heading"><div><h2>照片管理</h2><p>可上傳 JPG、PNG、WebP，單張最多 8 MB。拖曳封面照片可調整順序。</p></div></div>
        <div class="upload-row">
          <label>照片位置<select id="uploadTarget"><option value="hero">首頁封面輪播</option><option value="facility-0">KTV 空間</option><option value="facility-1">休閒／麻將空間</option><option value="facility-2">泳池空間</option><option value="facility-3">戶外料理區</option><option value="usePhoto">中段主照片</option><option value="ctaPhoto">頁尾背景</option></select></label>
          <label class="file-button">選擇照片<input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
          <button id="uploadButton" class="primary" type="button">上傳到草稿</button>
        </div>
        <div id="uploadProgress" class="message" aria-live="polite"></div>
        <div id="photoGrid" class="photo-grid"></div>
      </section>

      <section id="copyPanel" class="panel hidden">
        <div class="panel-heading"><div><h2>文字與資訊</h2><p>修改後先儲存為草稿，不會立刻影響官網。</p></div></div>
        <form id="contentForm" class="form-grid">
          <fieldset><legend>首頁主視覺</legend>
            <label>小標<input data-path="hero.eyebrow" type="text" maxlength="80"></label>
            <label>主標第一行<input data-path="hero.titleLine1" type="text" maxlength="40"></label>
            <label>主標第二行<input data-path="hero.titleLine2" type="text" maxlength="40"></label>
            <label class="wide">介紹文字<textarea data-path="hero.description" maxlength="300" rows="4"></textarea></label>
          </fieldset>
          <fieldset><legend>費用與使用資訊</legend>
            <label>建議人數<input data-path="details.capacity" type="text" maxlength="30"></label>
            <label>使用方式<input data-path="details.schedule" type="text" maxlength="30"></label>
            <label>服務時段<input data-path="details.hours" type="text" maxlength="30"></label>
            <label>場地使用費<input data-path="details.price" type="text" maxlength="30"></label>
            <label>押金<input data-path="details.deposit" type="text" maxlength="30"></label>
            <label>付款方式<input data-path="details.payment" type="text" maxlength="30"></label>
            <label>停車<input data-path="details.parking" type="text" maxlength="30"></label>
          </fieldset>
          <fieldset><legend>聯絡方式</legend>
            <label>電話<input data-path="contact.phone" type="tel" maxlength="30"></label>
            <label>LINE 網址<input data-path="contact.lineUrl" type="url" maxlength="300"></label>
            <label>預約日曆網址<input data-path="contact.calendarUrl" type="url" maxlength="300"></label>
            <label class="wide">Google 地圖網址<input data-path="contact.mapUrl" type="url" maxlength="500"></label>
          </fieldset>
          <button class="primary" type="submit">儲存草稿</button><p id="saveMessage" class="message" aria-live="polite"></p>
        </form>
      </section>

      <section id="publishPanel" class="panel hidden">
        <div class="publish-card"><p class="eyebrow">READY TO PUBLISH</p><h2>確認後再更新官網</h2><p>「儲存草稿」只會保存在後台；按下發布後，訪客才會看到新內容。</p><div class="publish-actions"><button id="previewButton" class="secondary" type="button">預覽草稿</button><button id="restoreButton" class="secondary" type="button">恢復已發布版本</button><button id="publishButton" class="primary" type="button">正式發布</button></div><p id="publishMessage" class="message" aria-live="polite"></p><div class="revision-block"><h3>最近發布版本</h3><div id="revisionList" class="revision-list">正在載入…</div></div></div>
      </section>
    </section>
  </main>
  <dialog id="previewDialog"><div class="dialog-head"><h2>草稿預覽</h2><button id="closePreview" class="secondary" type="button">關閉</button></div><iframe id="previewFrame" title="網站草稿預覽"></iframe></dialog>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
