<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f38"><title>房務工作台｜俐姐的家</title><link rel="stylesheet" href="/housekeeping/housekeeping.css"></head><body>
<main class="shell">
<section id="loginView" class="login-card"><div class="mark">俐</div><p class="eyebrow">LIJIE'S HOME</p><h1>房務工作台</h1><p class="sub">查看住宿、回報整備完成、管理備品。請使用既有房務帳號及密碼；工作台連結不會自動登入。</p><form id="loginForm"><label>房務帳號<input id="email" type="email" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">登入</button></form><p id="loginMessage" class="message" aria-live="polite"></p></section>
<section id="appView" class="app hidden">
<div class="mobile-hero"><div class="mini-mark">俐</div><div><span>LIJIE'S HOME</span><strong>今日房務，一眼就好。</strong></div></div>
<header class="top"><div><p class="eyebrow">HOUSEKEEPING</p><h1>房務工作台</h1><p id="accountEmail" class="sub"></p></div><button id="logoutButton" class="ghost">登出</button></header>
<nav class="tabs" aria-label="房務功能"><button data-tab="calendar" class="tab active">住宿日曆</button><button data-tab="inventory" class="tab">庫存管理</button></nav>
<section id="calendarPanel" class="panel">
<div class="month-head"><button id="prevMonth" class="square" aria-label="上一個月">‹</button><div><h2 id="monthTitle"></h2><p class="sub">點日期，查看入住與退房工作</p></div><button id="nextMonth" class="square" aria-label="下一個月">›</button></div>
<div class="calendar-toolbar"><span class="calendar-legend"><i></i>有住宿／退房工作</span><button id="refreshCalendar" class="ghost">重新整理</button></div><p id="calendarMessage" class="message" aria-live="polite"></p>
<div class="week" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="calendarGrid" class="calendar-grid"></div>
<section class="day-card" aria-labelledby="selectedTitle"><h2 id="selectedTitle">今日工作</h2><p class="sub">整理完成 → 拍客廳照片 → 按完成回報</p><div id="dayBookings" class="booking-list"></div></section>
</section>
<section id="inventoryPanel" class="panel hidden"><div class="section-head"><div><h2>備品庫存</h2><p class="sub">設備、消耗品、送洗狀態與未回件；不按入住自動扣量</p></div><button id="refreshInventory" class="ghost">重新整理</button></div><div id="inventoryList" class="inventory-list"></div>
<details class="form-card" open><summary>登記進貨／領用</summary><form id="movementForm"><label>備品<select id="stockItem" required></select></label><div class="two"><label>動作<select id="stockAction"></select></label><label>數量<input id="stockQty" type="number" min="0.01" step="0.01" required></label></div><p id="stockUnit" class="sub"></p><label>備註／報廢原因<input id="stockNote" placeholder="例如：補充衛生紙"></label><button class="primary">儲存</button></form><p id="stockMessage" class="message" aria-live="polite"></p></details>
<details class="form-card"><summary>新增備品</summary><form id="itemForm"><label>管理類型<select id="itemType" required><option value="">請選類型</option><option value="asset">設備資產</option><option value="consumable">消耗品</option><option value="linen">送洗布品</option></select></label><label>起始狀態<select id="itemInitialState"></select></label><label data-asset-field hidden>位置／房間<input id="itemLocation" maxlength="100"></label><label data-asset-field hidden>購入日期<input id="itemPurchasedDate" type="date"></label><label>備品名稱<input id="itemName" required></label><div class="two"><label>單位<input id="itemUnit" placeholder="包、瓶、個" required></label><label>目前庫存<input id="itemQty" type="number" min="0" step="0.01" value="0" required></label></div><label>安全庫存<input id="itemMin" type="number" min="0" step="0.01" value="0"></label><button class="primary">新增備品</button></form><p id="itemMessage" class="message" aria-live="polite"></p></details></section>
<nav class="bottom-nav" aria-label="房務主要功能"><button class="bottom-tab active" data-go="calendar"><span aria-hidden="true">▦</span>住宿日曆</button><button class="bottom-tab" data-go="inventory"><span aria-hidden="true">◫</span>庫存管理</button></nav>
</section></main><script type="module" src="/housekeeping/housekeeping.js"></script></body></html>
