<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f38"><title>房務工作台｜俐姐的家</title><style>
:root{--green:#173f38;--green2:#2d6d61;--cream:#f6f2e9;--line:#ded7cb;--text:#16332f;--muted:#687671;--danger:#a74949;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--text);background:#f4f4f1}.shell{max-width:760px;margin:auto;min-height:100vh;background:#fff;padding:env(safe-area-inset-top) 14px calc(28px + env(safe-area-inset-bottom))}.hidden{display:none!important}.login-card{max-width:430px;margin:12vh auto 0;padding:28px 22px;border:1px solid var(--line);border-radius:24px;background:#fff}.mark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--green);color:#fff;font-size:28px}.eyebrow{letter-spacing:.18em;font-size:12px;color:#9b7c4d;margin:14px 0 4px}.sub{color:var(--muted);font-size:14px;margin:4px 0 18px}h1,h2{margin:0}label{display:grid;gap:7px;font-size:14px;margin:14px 0}input,select{width:100%;font:inherit;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}.primary,.ghost,.square,.tab{font:inherit;border-radius:12px;cursor:pointer}.primary{width:100%;padding:14px;border:0;background:var(--green);color:#fff;font-weight:700}.ghost{padding:10px 13px;background:#fff;border:1px solid var(--line)}.message{min-height:20px;font-size:14px}.message.error{color:var(--danger)}.message.success{color:var(--green2)}.top{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 2px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;top:0;background:#fff;padding:8px 0;z-index:5}.tab{padding:12px;border:1px solid var(--line);background:#fff}.tab.active{background:var(--green);color:#fff;border-color:var(--green)}.panel{padding-top:14px}.month-head{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;text-align:center;margin-bottom:14px}.square{width:44px;height:44px;border:1px solid var(--line);background:#fff;font-size:26px}.week,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week span{text-align:center;color:var(--muted);font-size:12px;padding:8px 0}.day{min-height:74px;border:1px solid #ece7dd;border-radius:12px;background:#fff;padding:8px 5px;text-align:left;position:relative}.day.empty{border:0;background:transparent}.day.today{outline:2px solid #b99b69}.day.selected{background:#eaf5f1;border-color:#6aa394}.day.has-stay{border-color:#9cc7ba}.day .num{font-weight:700}.day .count{display:block;font-size:10px;color:var(--green2);margin-top:8px;line-height:1.25}.day-card{margin-top:18px;padding:18px;border-radius:18px;background:var(--cream)}.booking-list{display:grid;gap:10px;margin-top:12px}.booking{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--line)}.booking strong{font-size:18px}.booking .meta{color:var(--muted);font-size:13px;margin-top:5px}.badge{display:inline-block;margin-top:8px;font-size:12px;padding:4px 8px;border-radius:999px;background:#e6f3ef;color:var(--green)}.badge.pending{background:#fff1d6;color:#8b5b16}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.inventory-list{display:grid;gap:10px}.inventory{border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:6px}.inventory.low{border-color:#e1adad;background:#fff8f8}.inventory .qty{font-size:20px;font-weight:800}.inventory .meta{font-size:12px;color:var(--muted);grid-column:1/-1}.form-card{scroll-margin-bottom:150px;margin-top:16px;border:1px solid var(--line);border-radius:16px;padding:14px}.form-card summary{font-weight:800;cursor:pointer}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:390px){.shell{padding-left:10px;padding-right:10px}.day{min-height:66px;padding:7px 4px}.day .count{font-size:9px}.two{grid-template-columns:1fr}}

.mobile-hero{margin:8px 0 4px;padding:16px;border-radius:22px;background:linear-gradient(135deg,#173f38,#2d6d61);color:#fff;display:flex;gap:12px;align-items:center}.mobile-hero .mini-mark{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:22px;font-weight:800}.mobile-hero span,.mobile-hero strong{display:block}.mobile-hero span{font-size:10px;letter-spacing:.18em;opacity:.75}.mobile-hero strong{font-size:18px;margin-top:3px}.bottom-nav{display:none}@media(max-width:600px){.shell{padding-bottom:calc(150px + env(safe-area-inset-bottom))}.top{padding-top:8px}.top h1{font-size:24px}.tabs{display:none}.panel{padding-top:8px;padding-bottom:90px}.calendar-grid{gap:4px}.day{min-height:72px;border-radius:14px}.day-card{margin-top:14px}.bottom-nav{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:16px;right:16px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:5px;box-shadow:0 10px 26px rgba(18,48,43,.14);max-width:728px;margin:0 auto}.bottom-tab{border:0;background:transparent;border-radius:15px;padding:10px 6px;color:var(--muted);font-weight:700;font-size:12px}.bottom-tab span{display:block;font-size:20px;margin-bottom:2px}.bottom-tab.active{background:var(--green);color:#fff}.login-card{margin-top:8vh}}

</style></head><body>
<main class="shell">
<section id="loginView" class="login-card">
  <div class="mark">俐</div><p class="eyebrow">LIJIE'S HOME</p><h1>房務工作台</h1><p class="sub">登入後可查看住宿日曆與管理備品庫存。</p>
  <form id="loginForm"><label>房務帳號<input id="email" type="email" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">登入</button></form><p id="loginMessage" class="message"></p>
</section>
<section id="appView" class="app hidden">
<div class="mobile-hero"><div class="mini-mark">俐</div><div><span>LIJIE'S HOME</span><strong>今日房務，一眼就好。</strong></div></div>
<header class="top"><div><p class="eyebrow">HOUSEKEEPING</p><h1>房務工作台</h1><p id="accountEmail" class="sub"></p></div><button id="logoutButton" class="ghost">登出</button></header>
<nav class="tabs"><button data-tab="calendar" class="tab active">住宿日曆</button><button data-tab="inventory" class="tab">庫存管理</button></nav>
<section id="calendarPanel" class="panel">
  <div class="month-head"><button id="prevMonth" class="square">‹</button><div><h2 id="monthTitle"></h2><p class="sub">點日期查看當天住宿名單</p></div><button id="nextMonth" class="square">›</button></div>
  <div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
  <div id="calendarGrid" class="calendar-grid"></div>
  <section class="day-card"><h2 id="selectedTitle">今日住宿</h2><div id="dayBookings" class="booking-list"></div></section>
</section>
<section id="inventoryPanel" class="panel hidden">
  <div class="section-head"><div><h2>備品庫存</h2><p class="sub">進貨、領用與低庫存提醒</p></div><button id="refreshInventory" class="ghost">重新整理</button></div>
  <div id="inventoryList" class="inventory-list"></div>
  <details class="form-card" open><summary>登記進貨／領用</summary><form id="movementForm"><label>備品<select id="stockItem" required></select></label><div class="two"><label>動作<select id="stockAction"><option value="in">進貨</option><option value="out">領用／消耗</option></select></label><label>數量<input id="stockQty" type="number" min="0.01" step="0.01" required></label></div><label>備註<input id="stockNote" placeholder="例如：補充衛生紙"></label><button class="primary">儲存</button></form><p id="stockMessage" class="message"></p></details>
  <details class="form-card"><summary>新增備品</summary><form id="itemForm"><label>備品名稱<input id="itemName" required></label><div class="two"><label>單位<input id="itemUnit" placeholder="包、瓶、個" required></label><label>目前庫存<input id="itemQty" type="number" min="0" step="0.01" value="0" required></label></div><label>安全庫存<input id="itemMin" type="number" min="0" step="0.01" value="0"></label><button class="primary">新增備品</button></form><p id="itemMessage" class="message"></p></details>
</section>
<nav class="bottom-nav" aria-label="房務功能"><button class="bottom-tab active" data-go="calendar"><span>▦</span>住宿日曆</button><button class="bottom-tab" data-go="inventory"><span>◫</span>庫存管理</button></nav>
</section></main><script type="module" src="/housekeeping/housekeeping.js"></script></body></html>
